plugins {
    id 'com.android.application'
}

android {
    namespace "org.messagepad.einstein"
    compileSdk 35

    defaultConfig {
        applicationId 'org.messagepad.einstein'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DEINSTEIN_SDL3_FRONTEND=on'
                // Override with -PeinsteinAbis=arm64-v8a to build fewer ABIs
                abiFilters(*((project.findProperty('einsteinAbis') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',')))
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
        }
    }

    // Fork: a fixed debug key, so new test builds install over older ones.
    // It is public on purpose: never use it for a real release.
    signingConfigs {
        debug {
            storeFile rootProject.file('einstein-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation files('libs/SDL3-3.2.16.aar')
}
