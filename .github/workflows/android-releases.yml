name: Android APK releases (fork)

on:
  push:
    branches: [ android ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_VERSION: 3.2.16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Informational: the SHA-256 of the packages the app downloads, from
      # both the http and the https servers. The app refuses packages whose
      # checksum differs from the ones built in (app/SDL/TSDLApp.cpp).
      - name: Package checksums
        continue-on-error: true
        run: |
          for p in SystemPatches/english/2x00/mp717260.pkg SystemPatches/german/2x00/mp747260.pkg \
                   SystemPatches/english/eMate/EM737246.PKG Internet/NIE2/REGPKGS/inetenbl.pkg \
                   Internet/NIE2/REGPKGS/inetstup.pkg Internet/NIE2/ENETSUP/newtdev.pkg \
                   Internet/NIE2/ENETSUP/enetsup.pkg; do
            for base in http://www.unna.org/unna/apple/software https://web.mit.edu/unna/apple/software; do
              f=$(curl -fsSL --max-time 60 "$base/$p" | sha256sum | cut -c1-64)
              echo "CHECKSUM $f $base/$p"
            done
          done
          for u in http://www.kallisys.com/files/newton/ATA/ATA-Support-1.0.pkg \
                   https://www.kallisys.com/files/newton/ATA/ATA-Support-1.0.pkg; do
            echo "CHECKSUM $(curl -fsSL --max-time 60 "$u" | sha256sum | cut -c1-64) $u"
          done

      - name: Download prebuilt SDL3 for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh -R libsdl-org/SDL release download "release-${SDL_VERSION}" \
            -p "SDL3-devel-${SDL_VERSION}-android.zip" -D /tmp
          unzip -o -j "/tmp/SDL3-devel-${SDL_VERSION}-android.zip" '*.aar' -d android-project/app/libs
          ls -l android-project/app/libs

      - name: Build APK (arm64)
        working-directory: android-project
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug -PeinsteinAbis=arm64-v8a 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Einstein-android-arm64
          path: android-project/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a pre-release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Continue the numbering of the old workflow (builds 1-22).
          NUM=$((GITHUB_RUN_NUMBER + 22))
          TAG="android-build-${NUM}"
          cp android-project/app/build/outputs/apk/debug/app-debug.apk "Einstein-${TAG}.apk"
          gh release create "$TAG" "Einstein-${TAG}.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Einstein Android build ${NUM}" \
            --notes "Debug APK for arm64 Android devices, built from ${GITHUB_SHA}."

      # Save the build log to the ci-logs branch so it can be read with plain git.
      - name: Save build log
        if: always()
        run: |
          cp android-build.log /tmp/android-build.log 2>/dev/null || echo "No build log produced" > /tmp/android-build.log
          echo "Result: ${{ job.status }}  Run: ${GITHUB_RUN_NUMBER}  Commit: ${GITHUB_SHA}" > /tmp/status.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          rm -f android-build.log
          git fetch origin ci-logs:refs/remotes/origin/ci-logs && git checkout -f -B ci-logs origin/ci-logs || git checkout -f --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/android-build.log /tmp/status.txt .
          git add android-build.log status.txt
          git commit -m "Android build log, run ${GITHUB_RUN_NUMBER} (${{ job.status }})"
          git push origin ci-logs
